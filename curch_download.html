<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="교회회계 프로그램 사용 신청을 하세요." />
  <title>교회회계 프로그램 받기 | DREAM SW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a2e;
      --muted: #686879;
      --gold: #c9a84c;
      --paper: #f7f6f2;
      --line: #e6e3dc;
      --green: #2c5f2d;
      --red: #a52d2d;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans KR', sans-serif;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    header a { color: var(--ink); font-weight: 700; text-decoration: none; }
    main {
      width: min(100% - 32px, 560px);
      margin: 56px auto;
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(26, 26, 46, .07);
    }
    .eyebrow { margin: 0 0 8px; color: #8b7130; font-size: .78rem; font-weight: 700; }
    h1 { margin: 0; font-size: 1.65rem; line-height: 1.35; }
    .intro { margin: 12px 0 26px; color: var(--muted); line-height: 1.7; }
    label { display: block; margin-bottom: 7px; font-size: .9rem; font-weight: 700; }
    input[type="email"] {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid #c9c8ce;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    input[type="email"]:focus { outline: 3px solid rgba(201, 168, 76, .25); border-color: var(--gold); }
    .consent { display: flex; gap: 9px; align-items: flex-start; margin: 16px 0 20px; color: var(--muted); font-size: .84rem; line-height: 1.55; }
    .consent input { margin: 4px 0 0; flex: 0 0 auto; }
    button, .download-link {
      display: inline-flex;
      min-height: 48px;
      width: 100%;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .65; }
    #formStatus, #successPanel { margin-top: 18px; }
    #formStatus:empty { display: none; }
    #formStatus.error { color: var(--red); }
    #successPanel { padding-top: 18px; border-top: 1px solid var(--line); }
    #successPanel h2 { margin: 0 0 8px; font-size: 1.1rem; }
    #successPanel p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; }
    .install-note { font-size: .84rem; }
    [hidden] { display: none !important; }
    .back-link { display: inline-block; margin-top: 22px; color: var(--muted); font-size: .88rem; }
    @media (max-width: 520px) {
      header { padding: 15px 18px; }
      main { margin: 24px auto; padding: 24px 20px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <header><a href="/curch_index.html">DREAM SW 교회회계</a></header>
  <main>
    <p class="eyebrow">CHURCH ACCOUNTING</p>
    <h1>교회회계 프로그램 받기</h1>
    <p class="intro">이메일을 등록하면 교회회계 프로그램 접속 링크가 열립니다.</p>

    <form id="downloadForm" action="https://formspree.io/f/mbgloaao" method="POST">
      <input type="hidden" name="_subject" value="교회회계 프로그램 신청" />
      <input type="hidden" name="requestType" value="교회회계 프로그램" />
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-10000px;" />
      <label for="email">이메일 주소</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
      <label class="consent">
        <input type="checkbox" name="consent" value="교회회계 프로그램 제공 및 도입 안내 수신" required />
        <span>교회회계 프로그램 제공 및 도입 안내를 위해 이메일을 수집·이용하는 데 동의합니다.</span>
      </label>
      <button id="submitButton" type="submit">교회회계 프로그램 신청</button>
      <p id="formStatus" role="status" aria-live="polite"></p>
    </form>

    <section id="successPanel" hidden aria-live="polite">
      <h2>신청이 접수되었습니다.</h2>
      <p id="successMessage">아래 버튼에서 교회회계 프로그램을 열 수 있습니다.</p>
      <a id="appLink" class="download-link" href="#" target="_blank" rel="noopener">교회회계 프로그램 열기</a>
      <p class="install-note" style="margin-top:14px;">스마트폰에서는 열린 화면에서 <b>홈 화면에 추가</b>(아이폰) 또는 <b>앱으로 설치하기</b>(안드로이드)를 선택하면 앱처럼 사용할 수 있습니다.</p>
    </section>
    <a class="back-link" href="/curch_index.html">소개 페이지로 돌아가기</a>
  </main>

  <script>
    // TODO: 교회회계 프로그램의 접속(또는 다운로드) 주소를 여기에 입력하세요.
    // 비워 두면 링크 버튼 대신 "이메일로 안내드립니다" 문구가 표시됩니다.
    const APP_URL = '';

    const form = document.getElementById('downloadForm');
    const button = document.getElementById('submitButton');
    const status = document.getElementById('formStatus');
    const appLink = document.getElementById('appLink');
    const successMessage = document.getElementById('successMessage');
    const installNote = document.querySelector('.install-note');

    if (APP_URL) {
      appLink.href = APP_URL;
    } else {
      appLink.hidden = true;
      installNote.hidden = true;
      successMessage.textContent = '입력하신 이메일로 접속 링크를 안내해 드리겠습니다.';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      status.className = '';
      status.textContent = '신청 내용을 전송하고 있습니다...';
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error('신청을 전송하지 못했습니다. 잠시 후 다시 시도해 주세요.');
        form.hidden = true;
        status.textContent = '';
        document.getElementById('successPanel').hidden = false;
      } catch (error) {
        status.className = 'error';
        status.textContent = error.message || '네트워크 오류가 발생했습니다.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
